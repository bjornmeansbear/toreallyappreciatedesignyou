<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To Really Appreciate Design You…</title>
  <meta name="description" content="Visitor-written endings to one sentence, one at random.">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="stylesheet" href="kit.css">
  <link rel="stylesheet" href="trady.css">
  <script src="kits.js"></script>
</head>

<body class="random">
  <div class="container">

    <header>
      <a class="altview" href="list.html">View all</a>
    </header>

    <main>
      <h1>
        <!-- The no-JS fallback is the original's default ending.
             trady.js swaps in a random one on load and on every press. -->
        <button type="button" id="trady" aria-describedby="trady-hint">
          <span class="lead-in">To really appreciate design you</span>
          <em id="trady-entry" aria-live="polite">need the proper equipment.</em>
        </button>
      </h1>
      <p id="trady-hint" class="visually-hidden">Press for another ending.</p>
    </main>

    <footer>
      <p>Made in 2009 as a &ldquo;poster&rdquo; for a visiting artist workshop with Andrew Blauvelt. Every ending
        was written by a visitor to the original website.</p>
      <p>&copy; 2009&ndash;2026 Kristian Bj&oslash;rnard &para; A <a href="https://a.wjerk.shop/">Wjerk</a> project</p>
    </footer>

  </div>


  <script src="trady.js" defer></script>
</body>

</html>
